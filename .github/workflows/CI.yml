name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
          fetch-depth: 20

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure Signing Keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing signing secrets (SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD)."
            exit 1
          fi
          KEYSTORE_PATH="${{ runner.temp }}/release.keystore"
          python3 - "$KEYSTORE_PATH" << 'PY'
          import base64
          import binascii
          import os
          import re
          import sys

          out_path = sys.argv[1]
          raw = os.environ.get("KEYSTORE_B64", "")
          cleaned = re.sub(r"\s+", "", raw).replace("-", "+").replace("_", "/")
          if cleaned.endswith("\u23ce"):
              print("::warning::Stripped trailing '⏎' character from SIGNING_KEYSTORE_BASE64; re-save the secret without it.", file=sys.stderr)
              cleaned = cleaned[:-1]
          cleaned += "=" * (-len(cleaned) % 4)
          try:
              data = base64.b64decode(cleaned, validate=True)
          except (binascii.Error, ValueError) as exc:
              print(f"::error::SIGNING_KEYSTORE_BASE64 is not valid base64 (cleaned length={len(cleaned)}): {exc}. Re-encode your .jks file cleanly (e.g. 'base64 -w 0 your.jks; echo') and update the secret.", file=sys.stderr)
              sys.exit(1)

          if len(data) < 32:
              print(f"::error::Decoded keystore is unexpectedly small ({len(data)} bytes). Verify SIGNING_KEYSTORE_BASE64 contains the base64-encoded .jks/.keystore file.", file=sys.stderr)
              sys.exit(1)

          with open(out_path, "wb") as f:
              f.write(data)
          PY
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "CI=true" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Derive Version Metadata
        id: version
        run: |
          BASE_CODE=$(grep -E 'def baseVersionCode\s*=' smarttubetv/build.gradle | head -n 1 | sed -E 's/.*=\s*([0-9]+).*/\1/')
          BASE_NAME=$(grep -E 'def baseVersionName\s*=' smarttubetv/build.gradle | head -n 1 | awk -F'"' '{print $2}')
          VERSION_CODE=$((BASE_CODE * 10000 + GITHUB_RUN_NUMBER))
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RELEASE_TAG="${{ github.ref_name }}"
            VERSION_NAME="${RELEASE_TAG#v}"
          else
            RELEASE_TAG="ci-${{ github.run_number }}"
            VERSION_NAME="${BASE_NAME}-ci-${{ github.run_number }}"
          fi
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Build Debug APK (Pull Request Check)
        if: github.event_name == 'pull_request'
        run: ./gradlew clean assembleStstableDebug --stacktrace

      - name: Build Signed Release APKs
        if: github.event_name != 'pull_request'
        run: ./gradlew clean assembleStstableRelease --stacktrace

      - name: Compute Checksums and Generate Update Manifest
        if: github.event_name != 'pull_request'
        run: |
          APK_DIR="./smarttubetv/build/outputs/apk/ststable/release"
          DIST_DIR="${{ runner.temp }}/dist"
          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR"

          cp "$APK_DIR"/*.apk "$DIST_DIR"/

          python3 - "$DIST_DIR" "${{ github.repository }}" "$RELEASE_TAG" "$VERSION_CODE" "$VERSION_NAME" << 'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys

          dist_dir, repo, release_tag, version_code_str, version_name = sys.argv[1:6]
          version_code = int(version_code_str)
          base_download_url = f"https://github.com/{repo}/releases/download/{release_tag}"

          abis = ["arm64-v8a", "armeabi-v7a", "x86", "universal"]
          apks = {}
          sha_lines = []

          for filename in sorted(os.listdir(dist_dir)):
              if not filename.endswith(".apk"):
                  continue
              path = os.path.join(dist_dir, filename)
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(65536), b""):
                      h.update(chunk)
              digest = h.hexdigest()
              size = os.path.getsize(path)
              sha_lines.append(f"{digest}  {filename}")

              for abi in abis:
                  if filename.endswith(f"_{abi}.apk"):
                      apks[abi] = {
                          "url": f"{base_download_url}/{filename}",
                          "sha256": digest,
                          "size": size,
                      }
                      break

          if "universal" not in apks:
              raise RuntimeError("Missing universal APK in release outputs")

          try:
              log_output = subprocess.check_output(
                  ["git", "log", "-n", "10", "--pretty=format:%s"],
                  text=True,
              )
              changelog = [line.strip() for line in log_output.splitlines() if line.strip()]
          except Exception:
              changelog = [f"Release {version_name}"]

          manifest = {
              "versionCode": version_code,
              "versionName": version_name,
              "apkUrl": apks["universal"]["url"],
              "sha256": apks["universal"]["sha256"],
              "size": apks["universal"]["size"],
              "minSupportedVersionCode": 0,
              "changelog": changelog,
              "apks": apks,
          }

          with open(os.path.join(dist_dir, "manifest.json"), "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")

          with open(os.path.join(dist_dir, "checksums.sha256"), "w", encoding="utf-8") as f:
              f.write("\n".join(sha_lines) + "\n")
          PY

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DIST_DIR="${{ runner.temp }}/dist"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$DIST_DIR"/* --clobber
            gh release edit "$RELEASE_TAG" --latest
          else
            if [ "${{ github.ref_type }}" = "tag" ]; then
              gh release create "$RELEASE_TAG" "$DIST_DIR"/* \
                --title "SmartTube Pretty $VERSION_NAME" \
                --generate-notes \
                --latest
            else
              gh release create "$RELEASE_TAG" "$DIST_DIR"/* \
                --target "${{ github.sha }}" \
                --title "SmartTube Pretty $VERSION_NAME" \
                --generate-notes \
                --latest
            fi
          fi

      - name: Clean up temporary signing key
        if: always() && github.event_name != 'pull_request'
        run: rm -f "${{ runner.temp }}/release.keystore"
